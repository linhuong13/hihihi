['touchend','pointerdown','click','keydown'].forEach(ev=>document.addEventListener(ev,()=>{if(!muted)music();else if(AC)AC.resume()},{passive:true}));
function sfx(){if(!AC||muted)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.setValueAtTime(1400,t);o.frequency.exponentialRampToValueAtTime(150,t+.25);g.gain.setValueAtTime(.15,t);g.gain.exponentialRampToValueAtTime(.001,t+.28);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.3);const n=AC.createBuffer(1,AC.sampleRate*.7,AC.sampleRate),d=n.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g2=AC.createGain();s.buffer=n;f.type='lowpass';f.frequency.value=900;g2.gain.value=.6;s.connect(f);f.connect(g2);g2.connect(AC.destination);s.start(t+.22)}
function blast(ch){sfx();const el=$('g').children[MAP.join('').indexOf(ch)];if(!el)return;const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,E=['💥','✨','🎆','🔥','⭐','🎇'];for(let i=0;i<18;i++){const p=document.createElement('div');p.className='p';p.textContent=E[i%6];p.style.left=cx-13+'px';p.style.top=cy-13+'px';const a=Math.random()*6.28,d=60+Math.random()*110;p.style.setProperty('--dx',Math.cos(a)*d+'px');p.style.setProperty('--dy',Math.sin(a)*d+'px');p.style.setProperty('--r',(Math.random()*720-360)+'deg');document.body.appendChild(p);setTimeout(()=>p.remove(),950)}const g=$('g');g.classList.remove('shake');void g.offsetWidth;g.classList.add('shake')}
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').toLowerCase().replace(/\s+/g,' ').trim();
function render(){
  let h='';
  MAP.forEach((row,y)=>[...row].forEach((ch,x)=>{
    let cls='c f'+((x+y)%2+1),t='';
    if(ch==='#'){const k=(x+y)%3;cls='c w w'+k;t=['🥐','🥖',MAC][k]}
    else if(x===me[0]&&y===me[1])t='<span class="me">🦸‍♂️</span>';
    else if(ch==='E')t='🗼';
    else if(/\d/.test(ch)){t=open.has(ch)?'<span class="ex">💥</span>':'<span class="gt">💣<b>'+ch+'</b></span>'}
    h+='<div class="'+cls+'">'+t+'</div>';
  }));
  $('g').innerHTML=h;$('prog').textContent='Câu đã qua: '+open.size+'/5';
}
function show(html){$('card').innerHTML=html;$('ov').style.display='flex';busy=true}
function hide(){$('ov').style.display='none';busy=false}
function start(){
  show('<h2>Bonjour, voyageur !</h2><p>Để đến được Paris, hãy vượt qua 5 quả bom bằng 5 câu hỏi. Trả lời sai là phải đi lại từ đầu.</p><p>Điền họ và tên của bạn vào đây:</p><input id="nm" placeholder="VD: Phạm Tuấn Hùng" autocomplete="off"><div id="err" style="color:#a01e2b;min-height:20px;font-size:14px"></div><button class="btn" onclick="go()">Lên đường ✈️</button>');
  $('nm').onkeydown=e=>{if(e.key==='Enter')go()};
}
function go(){const key=Object.keys(LETTERS).find(k=>norm(k)===norm($('nm').value));if(!key){$('err').textContent='Không tìm thấy tên này. Hãy nhập đúng đầy đủ họ và tên nhé!';$('nm').focus();return}name=key;$('who').textContent='✦ '+name;music();reset();hide()}
function reset(){me=[1,1];open=new Set();render()}
function move(dx,dy){
  if(busy||!name)return;
  const x=me[0]+dx,y=me[1]+dy,ch=MAP[y]&&MAP[y][x];
  if(!ch||ch==='#')return;
  if(/\d/.test(ch)&&!open.has(ch))return ask(+ch-1,ch);
  me=[x,y];render();
  if(ch==='E')win();
}
function shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function ask(i,ch){
  const q=QS[i];window.sel=new Set();
  show('<h2>Câu hỏi '+(i+1)+'/5</h2><p><b>'+q.q+'</b></p>'+shuf(q.o.map((t,k)=>[t,k])).map(([t,k])=>'<button class="o" data-k="'+k+'">'+t+'</button>').join('')+(q.m?'<button class="btn" id="ok">Xác nhận</button>':''));
  const bs=[...document.querySelectorAll('.o')];
  bs.forEach(b=>b.onclick=()=>{
    const k=+b.dataset.k;
    if(!q.m)return check(i,ch,[k]);
    sel.has(k)?sel.delete(k):sel.add(k);b.classList.toggle('on');
  });
  if(q.m)$('ok').onclick=()=>check(i,ch,[...sel]);
}
function check(i,ch,pick){
  const a=QS[i].a;
  if(pick.length===a.length&&a.every(k=>pick.includes(k))){open.add(ch);hide();render();blast(ch)}
  else show('<div class="lose"><h2>💥 Boom! Sai rồi…</h2><p>Quả bom nổ mất rồi. Bạn phải quay lại điểm xuất phát và thử lại nhé!</p><button class="btn" onclick="reset();hide()">Chơi lại</button></div>');
}
function findLetter(){
  const n=norm(name);let key=Object.keys(LETTERS).find(k=>norm(k)===n);
  const L=key?LETTERS[key]:DEFAULT_LETTER;
  const f=s=>s.replace(/\{name\}/g,key||name);
  return {email:L.email||'',subject:f(L.subject),body:f(L.body)};
}
function win(){
  const L=findLetter();window.cur=L;
  const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
  show('<div class="env">💌</div><h2 style="text-align:center">Chúc mừng bạn đã chiến thắng!</h2><div class="letter">'+esc(L.body)+'</div><button class="btn" onclick="start()">Chơi lại</button>');
}
document.addEventListener('keydown',e=>{
  const m={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]}[e.key];
  if(m&&!busy){e.preventDefault();move(...m)}
});
document.querySelectorAll('#pad button').forEach(b=>{const go=()=>move(...b.dataset.d.split(',').map(Number));b.addEventListener('touchstart',e=>{e.preventDefault();go()},{passive:false});b.addEventListener('click',go)});
document.addEventListener('gesturestart',e=>e.preventDefault());
$('mt').onclick=()=>{muted=!muted;if(mg)mg.gain.value=muted?0:.3;$('mt').textContent=muted?'🔇':'🔊'};
me=[1,1];open=new Set();render();start();
</script></body></html>
